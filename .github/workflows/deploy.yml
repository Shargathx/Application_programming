name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Second_Assignment/task-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Second_Assignment/task-tracker

      - name: Build
        run: npm run build
        working-directory: Second_Assignment/task-tracker

      - name: Prepare Pages Directory
        run: |
          mkdir -p public-pages/Second_Assignment/task-tracker
          cp -r Second_Assignment/task-tracker/dist/* public-pages/Second_Assignment/task-tracker/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-pages

      - name: Setup Pages
        uses: actions/configure-pages@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
